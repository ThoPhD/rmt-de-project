name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: analytics
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: default_password
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-clickhouse

      - name: Prepare Raw Data in ClickHouse
        run: |
          # 1. Create raw database and tables
          curl -s -u default:default_password "http://localhost:8123/" --data-binary "CREATE DATABASE IF NOT EXISTS raw"
          
          curl -s -u default:default_password "http://localhost:8123/" --data-binary "
            CREATE TABLE raw.users (
              user_id String,
              kyc_level String,
              created_at String,
              updated_at String
            ) ENGINE = MergeTree() ORDER BY tuple()"
            
          curl -s -u default:default_password "http://localhost:8123/" --data-binary "
            CREATE TABLE raw.transactions (
              txn_id String,
              user_id String,
              status String,
              source_currency String,
              destination_currency String,
              created_at String,
              source_amount String,
              destination_amount String
            ) ENGINE = MergeTree() ORDER BY tuple()"
            
          curl -s -u default:default_password "http://localhost:8123/" --data-binary "
            CREATE TABLE raw.rates (
              symbol String,
              open_time String,
              open String,
              high String,
              low String,
              close String,
              volume String,
              close_time String,
              quote_asset_volume String,
              num_trades String,
              taker_buy_base String,
              taker_buy_quote String,
              ignore String
            ) ENGINE = MergeTree() ORDER BY tuple()"
            
          # 2. Load CSV data into raw tables
          curl -s -u default:default_password "http://localhost:8123/?query=INSERT+INTO+raw.users+FORMAT+CSVWithNames" --data-binary @rtm_dbt_clickhouse/seeds/users.csv
          curl -s -u default:default_password "http://localhost:8123/?query=INSERT+INTO+raw.transactions+FORMAT+CSVWithNames" --data-binary @rtm_dbt_clickhouse/seeds/transactions.csv
          curl -s -u default:default_password "http://localhost:8123/?query=INSERT+INTO+raw.rates+FORMAT+CSVWithNames" --data-binary @rtm_dbt_clickhouse/seeds/binance_rates_sample.csv

      - name: Run DBT compilation and tests
        env:
          DBT_PROFILES_DIR: .
        run: |
          cd rtm_dbt_clickhouse
          dbt deps
          dbt compile
          dbt run --select staging
          dbt snapshot
          dbt run
          dbt test
